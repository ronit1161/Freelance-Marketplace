server:
  port: 0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
        - id: user-service-route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**

eureka:
  client:
    enabled: false

