  #   ports: ["8082:8082"]
  #   depends_on: [discovery-server, mysql]
  #
  # gig-service:
  #   build: ./gig-service
  #   container_name: marketplace-gig-service
  #   ports: ["8083:8083"]
  #   depends_on: [discovery-server, mysql]
  #
  # order-service:
  #   build: ./order-service
  #   container_name: marketplace-order-service
  #   ports: ["8084:8084"]
