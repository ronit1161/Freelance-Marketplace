version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database Service (MySQL 8.x)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: marketplace-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Discovery Server (Eureka Server)
  # ---------------------------------------------------------------------------
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: marketplace-discovery-server
    ports:
      - "${DISCOVERY_SERVER_PORT:-8761}:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - marketplace-network

  # ---------------------------------------------------------------------------
  # API Gateway (Spring Cloud Gateway)
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: marketplace-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    networks:
      - marketplace-network

  # ---------------------------------------------------------------------------
  # FUTURE MICROSERVICES PLACEHOLDERS
